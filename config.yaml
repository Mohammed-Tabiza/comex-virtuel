# Configuration du COMEX virtuel
# Les valeurs ${NOM} sont remplacées par les variables d'environnement correspondantes.
#
# hebergement (par modèle) : interne | externe
#   interne : le modèle tourne dans l'entreprise (ex. vLLM sur site)
#   externe : les données sortent de l'entreprise (ex. modèles -cloud d'Ollama). Valeur par défaut.
# En mode reel, un dossier confidentiel ne peut être confié qu'à des modèles internes :
# la séance est refusée si un seul agent pointe vers un modèle externe.

# simulation : réponses préenregistrées, aucun appel aux modèles (pour tester l'interface)
# reel       : appels à Ollama
# La variable d'environnement COMEX_MODE est prioritaire sur cette valeur.
mode: simulation

modeles:
  gemma:
    libelle: "Gemma 4 31B Cloud"
    famille: ollama                   # pilote les paramètres d'API (thinking...)
    lignee: gemma                     # famille d'entraînement, pour diversifier les avis
    hebergement: externe              # modèle -cloud : exécuté sur les serveurs d'Ollama
    base_url: "http://localhost:11434/v1"
    api_key: ""                      # aucune clé API
    model: "gemma4:31b-cloud"
    contexte_max: 32768
    concurrence_max: 4
    temperature: 0.6
    max_tokens: 3072

  gpt_oss:
    libelle: "GPT OSS 120B Cloud"
    famille: ollama
    lignee: gpt-oss
    hebergement: externe
    base_url: "http://localhost:11434/v1"
    api_key: ""                      # aucune clé API
    model: "gpt-oss:120b-cloud"
    contexte_max: 32768
    concurrence_max: 4
    temperature: 0.5
    max_tokens: 4096

# Bibliothèque des comités (rôles, fonctions du protocole, gabarits) et comité proposé par défaut
bibliotheque: comites
gabarit_defaut: comex

# Affectation des modèles aux membres d'un comité (le comité varie d'une séance à l'autre)
affectation:
  president: gemma                  # président ou animateur
  contradicteur: gpt_oss
  experts: [gemma, gpt_oss]         # répartis à tour de rôle entre les experts du comité
  par_role:                         # exceptions, rôle par rôle (facultatif)
    finance: gemma
    clients: gemma
    rh: gemma
    operations: gpt_oss
    risques: gpt_oss
  thinking: [president, contradicteur]   # membres pour lesquels le mode réflexion est activé
  # preference : si le contradicteur partage la lignée du président, un modèle d'une autre lignée
  #              est choisi lorsqu'il en existe un ; sinon le choix est conservé et signalé.
  # ignorer    : le modèle indiqué est toujours utilisé.
  famille_differente_contradicteur: preference

protocole:
  # La comparaison détaillée des options nécessite une réponse plus longue.
  synthese_max_tokens: 6144
  # Taille maximale du dossier (en tokens estimés) avant avertissement
  budget_dossier_tokens: 15000
  # json_schema : sortie contrainte par vLLM (recommandé)
  # consigne    : schéma donné dans le prompt uniquement (si json_schema pose problème)
  sortie_structuree: json_schema
  # Durée simulée d'un appel en mode simulation (secondes, min / max)
  simulation_duree: [3, 8]
