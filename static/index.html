<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMEX virtuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1116; --panel:#161a21; --panel-2:#1c212a; --line:#2a313c; --line-2:#363f4c;
  --text:#e8e6e1; --muted:#9aa3ae; --faint:#6b7480;
  --brass:#c9a25c; --brass-soft:rgba(201,162,92,.16);
  --qwen:#8b97ff; --qwen14:#3fc7b5; --mistral:#ff8f45;
  --ok:#5fcf8a; --warn:#f2c14e; --err:#ff6b6b; --think:#b48cff;
  --fav:#5fcf8a; --favc:#a6d96a; --res:#f2c14e; --def:#ff6b6b;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);overflow:hidden}
button,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}

/* ---------- en-tête */
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.marque{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.marque span{color:var(--brass)}
.ctrl{display:flex;gap:8px;align-items:center;margin-left:8px}
select{background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;min-width:200px}
.btn{background:var(--brass);color:#1a1408;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.chips{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip.sim{color:var(--warn);border-color:rgba(242,193,78,.4)}
.chip.reel{color:var(--ok);border-color:rgba(95,207,138,.4)}
.chip.alerte{color:var(--err);border-color:rgba(255,107,107,.5)}
.chip.conf{color:var(--brass);border-color:rgba(201,162,92,.5)}
.chip.rejeu{color:var(--think);border-color:rgba(180,140,255,.5)}
#choixRejeu{min-width:0;width:250px;text-overflow:ellipsis} #vitesse{min-width:0}

/* ---------- étapes */
.etapes{display:flex;gap:0;padding:10px 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.etape{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12.5px;white-space:nowrap}
.etape .pt{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
.etape+.etape::before{content:"";width:28px;height:1px;background:var(--line-2);margin:0 10px}
.etape.fait{color:var(--muted)} .etape.fait .pt{background:var(--muted)}
.etape.actif{color:var(--brass)} .etape.actif .pt{background:var(--brass);box-shadow:0 0 0 4px var(--brass-soft)}

/* ---------- corps */
main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(360px,1fr);min-height:0}
.salle{position:relative;min-height:0;overflow:hidden;border-right:1px solid var(--line)}
.table-zone{position:absolute;inset:40px 18px 46px}
.table{position:absolute;left:19%;right:19%;top:21%;bottom:21%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,#232c38 0%,#18202a 60%,#121820 100%);
  border:1px solid rgba(201,162,92,.35);box-shadow:inset 0 0 60px rgba(0,0,0,.45),0 20px 60px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:5% 9%}
.table .q{font-family:var(--serif);font-size:clamp(14px,1.35vw,19px);line-height:1.35;color:#efe7d6}
.table .ph{margin-top:10px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--brass)}
.table .stats{margin-top:8px;font-size:12px;color:var(--muted)}
svg.liens{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
svg.liens line{stroke:var(--mistral);stroke-width:1.6;stroke-dasharray:6 6;animation:defile 1.2s linear infinite;opacity:.85}
@keyframes defile{to{stroke-dashoffset:-24}}

.siege{position:absolute;width:200px;z-index:2;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 11px;transition:border-color .25s,box-shadow .25s,transform .25s,opacity .25s;opacity:.72}
.siege.actif{opacity:1;border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent),0 12px 30px rgba(0,0,0,.4);transform:translate(-50%,-50%) scale(1.04);z-index:3}
.siege.termine{opacity:1}
.siege.erreur{opacity:1;border-color:var(--err)}
.s-haut{display:flex;gap:9px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;
  background:color-mix(in srgb,var(--c) 18%,var(--panel-2));color:var(--c);border:1.5px solid var(--c);flex:none;position:relative}
.siege.actif .avatar::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);animation:pouls 1.4s ease-out infinite}
@keyframes pouls{from{opacity:.8;transform:scale(.85)}to{opacity:0;transform:scale(1.25)}}
.s-nom{font-weight:600;font-size:13px;line-height:1.2}
.s-mod{font-size:11px;color:var(--c)}
.statut{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.statut .d{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.st-analyse .d{background:var(--warn)} .st-reflexion .d{background:var(--think);animation:clign 1s infinite}
.st-redaction .d{background:var(--c);animation:clign .6s infinite} .st-termine .d{background:var(--ok)} .st-erreur .d{background:var(--err)}
@keyframes clign{50%{opacity:.25}}
.extrait{margin-top:6px;font:11px/1.45 var(--mono);color:var(--muted);height:48px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.extrait.reflexion{color:#c9b6f2;font-style:italic;font-family:var(--sans)}
.extrait:empty::before{content:"—";color:var(--faint)}
.s-bas{margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--faint)}
.pos{border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:600;border:1px solid currentColor}
.pos.favorable{color:var(--fav)} .pos.favorable_sous_conditions{color:var(--favc)} .pos.reserve{color:var(--res)} .pos.defavorable{color:var(--def)}
.legende{position:absolute;left:20px;bottom:14px;display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legende i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

/* ---------- panneau droit */
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.onglets{display:flex;border-bottom:1px solid var(--line)}
.onglet{flex:1;background:none;border:0;padding:12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.onglet.on{color:var(--text);border-bottom-color:var(--brass)}
.onglet .n{font-size:11px;color:var(--faint);margin-left:4px}
.vue{flex:1;overflow-y:auto;padding:14px 16px;display:none}
.vue.on{display:block}
.vide{color:var(--faint);text-align:center;margin-top:60px;line-height:1.7}

.carte{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:11px 13px;margin-bottom:10px;background:var(--panel-2);animation:entree .35s ease}
@keyframes entree{from{opacity:0;transform:translateY(-6px)}}
.c-tete{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-tete b{font-size:13px}
.c-etape{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.8px}
.c-meta{margin-left:auto;font-size:11px;color:var(--faint)}
.carte p{margin:7px 0 0}
.carte details{margin-top:6px}
.carte summary{cursor:pointer;color:var(--muted);font-size:12px}
.carte h4{margin:10px 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);font-weight:600}
.carte ul{margin:0;padding-left:18px} .carte li{margin:3px 0}
.ref{display:inline-block;font:10.5px var(--mono);padding:0 6px;border-radius:5px;background:var(--brass-soft);color:var(--brass);cursor:pointer;border:0;vertical-align:1px}
.ref.invalide{background:rgba(255,107,107,.15);color:var(--err);text-decoration:line-through}
.ref:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.sources{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.comparaison{overflow-x:auto;margin-top:10px}
.comparaison table{table-layout:fixed;overflow-wrap:anywhere}
.comparaison th:first-child{width:36%}
.evaluation{font-weight:600;color:var(--brass)}
.source-tete{display:flex;justify-content:space-between;align-items:center;gap:12px}
.obj{display:flex;gap:8px;margin-top:7px}
.obj .id{font:600 11px var(--mono);color:var(--mistral);flex:none;padding-top:1px}
.att{font-size:10.5px;font-weight:600;border-radius:999px;padding:0 7px;border:1px solid currentColor}
.att.maintient{color:var(--res)} .att.ajuste{color:var(--qwen14)} .att.concede{color:var(--fav)}
.note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line-2);border-radius:10px;padding:9px 12px;margin-bottom:10px}

/* carte des positions */
.arene{position:relative;height:360px;margin:6px 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);overflow:hidden}
.arene .couloir{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.arene .nom-couloir{position:absolute;bottom:8px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);text-align:center;width:28%;line-height:1.25}
.arene .nom-couloir b{display:block;color:var(--text);font-size:13px}
.arene .niveau{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.045)}
.arene .niveau span{position:absolute;left:8px;top:-8px;font-size:10px;letter-spacing:.4px;color:var(--faint);background:var(--panel-2);padding-right:4px;text-transform:uppercase}
.point{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--sans);
  color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--panel));border:1.5px solid var(--c);z-index:2;opacity:0;
  transition:left 1.5s cubic-bezier(.6,0,.2,1),top 1.5s cubic-bezier(.6,0,.2,1),opacity .5s,box-shadow .4s}
.point.visible{opacity:1}
.point.bouge{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}
.arene.sans-transition .point{transition:none}
.arene svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.arene svg path{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:4 4;opacity:0;transition:opacity .6s 1.4s}
.arene.final svg path{opacity:.7}
.arene.sans-transition svg path{opacity:0;transition:none}
.recit{font-size:13px;color:var(--muted);line-height:1.6}
.recit b{color:var(--text)}
.chaleur{display:grid;gap:4px;margin-top:6px;font-size:12px;align-items:stretch}
.chaleur .tete{color:var(--muted);font-size:11.5px;text-align:center;align-self:end;padding-bottom:2px}
.chaleur .crit{color:var(--muted);align-self:center;padding-right:6px;line-height:1.3}
.cellule{border:0;border-radius:6px;padding:9px 4px;font-weight:600;font-size:11.5px;cursor:pointer;text-align:center;font-family:var(--sans)}
.cellule:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.ev-favorable{background:rgba(95,207,138,.18);color:var(--fav)}
.ev-mitige{background:rgba(242,193,78,.16);color:var(--res)}
.ev-defavorable{background:rgba(255,107,107,.17);color:var(--def)}
.ev-inconnu{background:repeating-linear-gradient(135deg,rgba(154,163,174,.13) 0 6px,rgba(154,163,174,.05) 6px 12px);color:var(--muted)}

/* dossier */
.doc{margin-bottom:14px} .doc b{font-size:13px}
.doc .sec{display:flex;gap:8px;align-items:baseline;margin:4px 0;font-size:12.5px;color:var(--muted)}

/* décision */
.reco{border:1px solid rgba(201,162,92,.45);background:var(--brass-soft);border-radius:12px;padding:13px 15px;font-family:var(--serif);font-size:15.5px;line-height:1.45}
.bloc{margin-top:16px}
.bloc h3{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);margin:0 0 6px;font-weight:600}
.bloc ul{margin:0;padding-left:18px} .bloc li{margin:4px 0}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel-2)}
.opt .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12.5px;margin-top:4px}
.opt .pour b{color:var(--fav)} .opt .contre b{color:var(--def)}
table.matrice{width:100%;border-collapse:collapse;font-size:12.5px}
.matrice td,.matrice th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.matrice th{color:var(--faint);font-weight:500;font-size:11.5px}
textarea{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:9px 10px;resize:vertical}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* validation du cadrage */
.voile{position:absolute;inset:0;background:rgba(8,10,14,.62);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.voile.on{display:flex}
.fenetre{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;max-width:640px;width:100%;max-height:100%;overflow-y:auto;padding:20px 22px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.fenetre h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 4px}
.fenetre .sous{color:var(--muted);font-size:13px;margin-bottom:12px}
.alerte-q{border-left:3px solid var(--warn);padding:6px 10px;background:rgba(242,193,78,.08);border-radius:6px;margin:4px 0}
.couverture{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:12.5px;margin-top:4px}
.couverture .porteurs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.porteur{border:1px solid var(--line-2);border-radius:999px;padding:0 7px;font-size:11px;color:var(--muted)}
.porteur.aucun{border-color:rgba(242,193,78,.6);color:var(--warn)}

/* section citée */
.pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,14,.55);z-index:20;padding:20px}
.pop.on{display:flex}
.pop .fenetre{max-width:560px}
.pop pre{white-space:pre-wrap;font:13px/1.55 var(--sans);color:var(--text);margin:8px 0 0}
.toast{position:fixed;bottom:18px;right:18px;background:var(--err);color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:30;max-width:420px}

/* mobile : cartes en liste */
@media (max-width:980px){
  body{overflow:auto} .app{height:auto}
  main{grid-template-columns:1fr}
  .salle{border-right:0;border-bottom:1px solid var(--line)}
  .table-zone{position:static;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:14px}
  .table{position:static;grid-column:1/-1;border-radius:14px;padding:16px}
  .siege{position:static;transform:none;width:auto}
  .siege.actif{transform:none}
  svg.liens{display:none}
  .legende{position:static;padding:0 16px 14px}
  aside{min-height:70vh}
  header{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="marque">COMEX <span>virtuel</span></div>
    <div class="ctrl">
      <select id="choixDossier" aria-label="Dossier de séance"></select>
      <select id="choixRejeu" aria-label="Séance en direct ou rejeu d'une séance enregistrée"></select>
      <select id="vitesse" aria-label="Vitesse du rejeu" hidden><option value="1">×1</option><option value="2" selected>×2</option><option value="4">×4</option></select>
      <button class="btn" id="btnLancer">Ouvrir la séance</button>
    </div>
    <div class="chips">
      <span class="chip" id="chipConf" hidden></span>
      <span class="chip" id="chipTokens">Dossier : —</span>
      <span class="chip" id="chipChrono">00:00</span>
      <span class="chip" id="chipMode">—</span>
    </div>
  </header>

  <nav class="etapes" id="etapes"></nav>

  <main>
    <section class="salle">
      <div class="table-zone" id="zone">
        <svg class="liens" id="liens" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div class="table">
          <div>
            <div class="q" id="question">Choisissez un dossier et ouvrez la séance.</div>
            <div class="ph" id="phaseTxt">En attente</div>
            <div class="stats" id="stats"></div>
          </div>
        </div>
      </div>
      <div class="legende" id="legende"></div>

      <div class="voile" id="voile">
        <div class="fenetre" id="fenValidation"></div>
      </div>
    </section>

    <aside>
      <div class="onglets">
        <button class="onglet on" data-vue="debat">Débat en direct<span class="n" id="nDebat"></span></button>
        <button class="onglet" data-vue="positions">Positions<span class="n" id="nPositions"></span></button>
        <button class="onglet" data-vue="dossier">Dossier</button>
        <button class="onglet" data-vue="decision">Décision</button>
      </div>
      <div class="vue on" id="vue-debat"><div class="vide">Les contributions des membres<br>apparaîtront ici en temps réel.</div></div>
      <div class="vue" id="vue-positions"><div class="vide">La carte des positions se remplit<br>au fil des avis des membres.</div></div>
      <div class="vue" id="vue-dossier"></div>
      <div class="vue" id="vue-decision"><div class="vide">Le dossier de décision sera disponible<br>à la fin de la séance.</div></div>
    </aside>
  </main>
</div>

<div class="pop" id="pop" role="dialog" aria-modal="true" aria-label="Passage cité" tabindex="-1"><div class="fenetre" id="popContenu"></div></div>
<div class="toast" id="toast"></div>

<script>
// Positions des sièges autour de la table (angle en degrés, 0 = droite, 90 = bas)
const ANGLES = {president:-90, strategie:-38, finance:5, clients:47, contradicteur:90, operations:133, risques:175, rh:-142};
const RX = 36.5, RY = 41;   // rayons de l'ellipse des sièges, en % de la zone
const PHASES = [["cadrage","Cadrage"],["validation","Validation humaine"],["analyses","Analyses indépendantes"],
  ["contradiction","Contradiction"],["reponses","Réponses"],["synthese","Synthèse"],["arbitrage","Arbitrage"]];
// Une couleur par modèle, attribuée dans l'ordre de config.yaml (quels que soient les noms des modèles)
const PALETTE = ["#8b97ff", "#ff8f45", "#3fc7b5", "#e58bd0", "#c9a25c"];
let COULEURS = {};
const NIVEAUX = ["favorable", "favorable_sous_conditions", "reserve", "defavorable"];
const NIVEAUX_COURTS = {favorable:"Favorable", favorable_sous_conditions:"Sous conditions", reserve:"Réservé", defavorable:"Défavorable"};
const ETAPES = {cadrage:"Cadrage", avis:"Avis initial", contre_analyse:"Contre-analyse", objections:"Objections", reponse:"Réponse", synthese:"Synthèse"};
const POS = {favorable:"Favorable", favorable_sous_conditions:"Favorable s/ conditions", reserve:"Réservé", defavorable:"Défavorable"};
const STATUTS = {attente:"En attente", analyse:"Lecture du dossier", reflexion:"Réflexion", redaction:"Rédaction", termine:"Terminé", erreur:"Erreur"};

const $ = s => document.querySelector(s);
const S = {config:null, configLive:null, seance:null, dossier:null, source:null, agents:{}, contributions:0, tokens:0, avis:{}, reponses:{}, objections:[], cadrage:null, synthese:null, refsValides:new Set(), t:0, timer:null, phase:null,
  rejeu:null, jetonRejeu:0, posInit:{}, posFin:{}, positionsVues:false};
const pause = ms => new Promise(r => setTimeout(r, ms));

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const avecRefs = s => esc(s).replace(/\[?(D\d+-§\d+)\]?/g, (_, r) => chipRef(r));
const chipRef = r => `<button type="button" class="ref ${S.refsValides.size && !S.refsValides.has(r) ? "invalide" : ""}" data-ref="${esc(r)}" data-dossier="${esc(S.dossier?.nom)}" title="${S.refsValides.has(r) ? "Voir la section" : "Référence introuvable dans le dossier"}">${esc(r)}</button>`;
const sourcesRefs = refs => `<div class="sources">${[...new Set(refs || [])].map(r => avecRefs(r)).join(" ")}</div>`;
const argumentSource = a => avecRefs(a.texte) + sourcesRefs(a.sources);
const EVALUATIONS = {favorable:"Favorable", mitige:"Mitigé", defavorable:"Défavorable", inconnu:"À documenter"};
const liste = (titre, items, f = avecRefs) => items && items.length ? `<h4>${titre}</h4><ul>${items.map(i => `<li>${f(i)}</li>`).join("")}</ul>` : "";
const couleur = id => COULEURS[S.config.agents[id].modele] || "var(--brass)";
const nomAgent = id => S.config.agents[id]?.nom || id;

// ------------------------------------------------------------------ initialisation
async function init() {
  S.config = S.configLive = await (await fetch("/api/config")).json();
  definirCouleurs(); majChipMode();

  const dossiers = await (await fetch("/api/dossiers")).json();
  $("#choixDossier").innerHTML = dossiers.map(d => `<option>${esc(d)}</option>`).join("");
  $("#choixDossier").onchange = chargerDossier;
  $("#choixRejeu").onchange = majBouton;
  $("#btnLancer").onclick = lancer;

  $("#etapes").innerHTML = PHASES.map(([id, l]) => `<div class="etape" data-ph="${id}"><span class="pt"></span>${l}</div>`).join("");
  majLegende();
  creerSieges();
  document.querySelectorAll(".onglet").forEach(b => b.onclick = () => ouvrirOnglet(b.dataset.vue));
  document.addEventListener("click", e => {
    const r = e.target.closest(".ref[data-ref]"); if (r) return voirSection(r.dataset.ref, r.dataset.dossier);
    const c = e.target.closest(".cellule[data-o]"); if (c) return voirCritere(+c.dataset.o, +c.dataset.c);
  });
  $("#pop").onclick = e => { if (e.target.id === "pop" || e.target.closest("[data-fermer-source]")) fermerSection(); };
  document.addEventListener("keydown", e => {
    if (!$("#pop").classList.contains("on")) return;
    if (e.key === "Escape") { e.preventDefault(); fermerSection(); }
    if (e.key === "Tab") {
      const boutons = [...$("#pop").querySelectorAll("button")];
      if (!boutons.length) { e.preventDefault(); return; }
      if (e.shiftKey && document.activeElement === boutons[0]) { e.preventDefault(); boutons.at(-1).focus(); }
      else if (!e.shiftKey && document.activeElement === boutons.at(-1)) { e.preventDefault(); boutons[0].focus(); }
    }
  });
  window.addEventListener("resize", dessinerLiens);
  if (dossiers.length) chargerDossier();
}

function definirCouleurs() {
  const noms = Object.keys(S.config.modeles || {});
  Object.values(S.config.agents).forEach(a => { if (!noms.includes(a.modele)) noms.push(a.modele); });
  COULEURS = Object.fromEntries(noms.map((m, i) => [m, PALETTE[i % PALETTE.length]]));
}

function majLegende() {
  const modeles = {};
  Object.values(S.config.agents).forEach(a => modeles[a.modele] = a);
  $("#legende").innerHTML = Object.entries(modeles).map(([m, a]) =>
    `<span><i style="background:${COULEURS[m]}"></i>${esc(a.libelle_modele)}${a.hebergement === "externe" ? " · externe" : a.hebergement === "interne" ? " · interne" : ""}</span>`).join("");
}

function majChipMode() {
  const mode = $("#chipMode");
  if (S.rejeu) {
    mode.textContent = `Rejeu ×${$("#vitesse").value} · ${S.rejeu.mode === "reel" ? "modèles réels" : "simulation"}`;
    mode.className = "chip rejeu"; return;
  }
  const externe = Object.values(S.config.agents).some(a => a.hebergement !== "interne");
  mode.textContent = S.config.mode === "reel" ? (externe ? "Modèles réels · externes" : "Modèles réels · internes") : "Mode simulation";
  mode.className = "chip " + (S.config.mode === "reel" ? (externe ? "sim" : "reel") : "sim");
}

function creerSieges() {
  const zone = $("#zone");
  zone.querySelectorAll(".siege").forEach(n => n.remove());
  for (const [id, a] of Object.entries(S.config.agents)) {
    const ang = ANGLES[id] * Math.PI / 180;
    const el = document.createElement("div");
    el.className = "siege"; el.id = "siege-" + id;
    el.style.left = (50 + RX * Math.cos(ang)) + "%";
    el.style.top = (50 + RY * Math.sin(ang)) + "%";
    el.style.setProperty("--c", couleur(id));
    el.innerHTML = `<div class="s-haut"><div class="avatar">${esc(a.initiales)}</div>
        <div><div class="s-nom">${esc(a.titre)}</div><div class="s-mod">${esc(a.libelle_modele)}${a.thinking ? " · thinking" : ""}</div></div></div>
      <div class="statut st-attente"><span class="d"></span><span class="lib">En attente</span></div>
      <div class="extrait"></div><div class="s-bas"></div>`;
    zone.appendChild(el);
    S.agents[id] = {statut: "attente"};
  }
}

async function chargerDossier() {
  const nom = $("#choixDossier").value;
  const d = await (await fetch(`/api/dossiers/${encodeURIComponent(nom)}`)).json();
  S.dossier = d;
  S.refsValides = new Set(d.documents.flatMap(doc => doc.sections.map(s => s.ref)));
  majTokens(d.tokens_estimes, S.configLive.budget_dossier_tokens);
  const conf = $("#chipConf");
  conf.hidden = false;
  conf.textContent = d.confidentiel ? "Confidentiel · modèles internes" : "Non confidentiel";
  conf.className = "chip" + (d.confidentiel ? " conf" : "");
  conf.title = d.description || (d.confidentiel ? "Ce dossier ne peut être confié qu'à des modèles hébergés dans l'entreprise." : "");
  await chargerRejeux();
  $("#vue-dossier").innerHTML = `<div class="note">Chaque agent analyse le même dossier. Cliquez sur une référence pour lire le passage cité.</div>` +
    d.documents.map(doc => `<div class="doc"><b>${doc.id} · ${esc(doc.titre)}</b><div style="font-size:11px;color:var(--faint)">${esc(doc.fichier)}</div>
      ${doc.sections.map(s => `<div class="sec">${chipRef(s.ref)}<span>${esc(s.titre)}</span></div>`).join("")}</div>`).join("");
}

async function chargerRejeux(selection = "") {
  const liste = S.dossier ? await (await fetch(`/api/dossiers/${encodeURIComponent(S.dossier.nom)}/rejeux`)).json() : [];
  const duree = t => `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
  $("#choixRejeu").innerHTML = `<option value="">Séance en direct</option>` + liste.map(r =>
    `<option value="${esc(r.id)}" title="${esc((r.modeles || []).join(" + "))}">Rejeu du ${esc(new Date(r.date).toLocaleString("fr-FR", {dateStyle: "short", timeStyle: "short"}))} (${duree(r.duree || 0)}${r.mode !== "reel" ? ", simulation" : ""}${r.decision ? ", décision" : ""})</option>`).join("");
  $("#choixRejeu").value = selection;
  majBouton();
}

function majBouton() {
  const rejeu = !!$("#choixRejeu").value, bouton = $("#btnLancer");
  $("#vitesse").hidden = !rejeu;
  bouton.textContent = rejeu ? "Rejouer la séance" : "Ouvrir la séance";
  const blocage = !rejeu && S.dossier?.blocage;
  bouton.disabled = !!blocage;
  bouton.title = blocage ? blocage.message : "";
  if (blocage) toast(blocage.message);
}

function majTokens(n, budget) {
  const c = $("#chipTokens");
  c.textContent = `Dossier : ~${n.toLocaleString("fr-FR")} / ${budget.toLocaleString("fr-FR")} tokens`;
  c.className = "chip" + (n > budget ? " alerte" : "");
}

// ------------------------------------------------------------------ séance
function reinitialiser(config) {
  if (S.source) S.source.close();
  S.jetonRejeu++;                                   // interrompt un rejeu en cours
  S.config = config; definirCouleurs(); majLegende();
  Object.assign(S, {avis:{}, reponses:{}, objections:[], cadrage:null, synthese:null, contributions:0, tokens:0, t:0, phase:null,
    posInit:{}, posFin:{}, positionsVues:false, liens:[]});
  creerSieges(); dessinerLiens();
  document.querySelectorAll(".etape").forEach(el => el.className = "etape");
  $("#vue-debat").innerHTML = ""; $("#nDebat").textContent = ""; $("#nPositions").textContent = "";
  $("#vue-positions").innerHTML = `<div class="vide">La carte des positions se remplit<br>au fil des avis des membres.</div>`;
  $("#vue-decision").innerHTML = `<div class="vide">Le dossier de décision sera disponible<br>à la fin de la séance.</div>`;
  $("#voile").classList.remove("on");
  $("#question").textContent = "Ouverture de la séance…"; $("#stats").textContent = "";
  ouvrirOnglet("debat");
  clearInterval(S.timer); const debut = Date.now();
  S.timer = setInterval(() => { const s = Math.floor((Date.now() - debut) / 1000); $("#chipChrono").textContent = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }, 500);
}

async function lancer() {
  const rejeu = $("#choixRejeu").value;
  if (rejeu) return rejouer(rejeu);
  S.rejeu = null;
  reinitialiser(S.configLive); majChipMode();
  $("#btnLancer").disabled = true;
  $("#choixDossier").disabled = true;
  const r = await fetch("/api/seances", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({dossier: $("#choixDossier").value})});
  if (!r.ok) {
    const detail = (await r.json().catch(() => ({}))).detail;
    toast(detail?.message || "Impossible d'ouvrir la séance");
    clearInterval(S.timer); $("#btnLancer").disabled = false; $("#choixDossier").disabled = false; return;
  }
  S.seance = (await r.json()).seance_id;
  S.source = new EventSource(`/api/seances/${S.seance}/evenements`);
  S.source.onmessage = m => traiter(JSON.parse(m.data));
}

// Rejoue le journal d'une séance enregistrée, sans appeler aucun modèle (démo sans risque)
async function rejouer(id) {
  const r = await fetch(`/api/dossiers/${encodeURIComponent(S.dossier.nom)}/rejeux/${encodeURIComponent(id)}`);
  if (!r.ok) return toast("Rejeu introuvable");
  const data = await r.json();
  S.rejeu = data; S.seance = null;
  // Anciens rejeux : pas de liste d'experts enregistrée, on la déduit des membres hors fonctions du protocole
  const experts = data.config.experts || Object.keys(data.config.agents).filter(id => id !== "president" && id !== "contradicteur");
  reinitialiser({...S.configLive, mode: data.mode, agents: data.config.agents, experts, modeles: data.config.modeles});
  majChipMode();
  const jeton = S.jetonRejeu, vitesse = +$("#vitesse").value;
  let precedent = 0;
  for (const e of data.evenements) {
    const ecart = Math.max(0, e.t - precedent); precedent = e.t;
    // Les silences sont raccourcis ; la validation humaine reste visible quelques secondes
    const attente = e.type === "validation_humaine" ? Math.max(3, Math.min(ecart, 5)) : Math.min(ecart, 2.5);
    await pause(attente / vitesse * 1000);
    if (jeton !== S.jetonRejeu) return;            // un autre rejeu ou une séance en direct a démarré
    traiter(e);
  }
}

function traiter(e) {
  switch (e.type) {
    case "dossier_charge": majTokens(e.dossier.tokens_estimes, e.budget);
      // Chaque séance a son comité : les experts affichés sont ceux de la séance, pas ceux du comité par défaut
      if (e.comite) { S.config = {...S.config, agents: e.comite.agents, experts: e.comite.experts}; }
      if (e.contexte && e.contexte.niveau !== "ok") note(texteContexte(e.contexte));
      if (e.depassement) note("Le dossier dépasse le budget de contexte configuré : les agents servis par les plus petits modèles risquent d'être tronqués."); break;
    case "phase": phase(e.phase); break;
    case "agent_statut": statut(e); break;
    case "agent_flux": flux(e); break;
    case "contribution": contribution(e); break;
    case "attente_validation": ouvrirValidation(e.cadrage, e); break;
    case "composition_revisee": revisionEquipe(e); break;
    case "contexte_compacte": note(`Contexte : le prompt « ${ETAPES[e.etape] || e.etape} » a été compacté (niveau ${e.niveau}) pour tenir dans le contexte du modèle (${e.entree.toLocaleString("fr-FR")} + ${e.sortie.toLocaleString("fr-FR")} tokens sur ${e.contexte_max.toLocaleString("fr-FR")}).`); break;
    case "contexte_depasse": note(e.message); toast(e.message); break;
    case "validation_humaine": $("#voile").classList.remove("on");
      note(e.action === "valider" ? "Cadrage validé par le décideur. Les analyses indépendantes démarrent." : "Nouveau cadrage demandé par le décideur.", e.complement); break;
    case "seance_terminee": fin(e); break;
    case "decision_enregistree": note("Décision humaine enregistrée dans le compte rendu.", e.texte); break;
    case "erreur": toast(e.message); $("#btnLancer").disabled = false; $("#choixDossier").disabled = false; clearInterval(S.timer); break;
  }
}

function phase(p) {
  S.phase = p;
  const i = PHASES.findIndex(x => x[0] === p);
  document.querySelectorAll(".etape").forEach((el, k) => el.className = "etape" + (k < i ? " fait" : k === i ? " actif" : ""));
  $("#phaseTxt").textContent = PHASES[i]?.[1] || p;
  if (p !== "contradiction" && p !== "reponses") { S.liens = []; dessinerLiens(); }
}

function statut(e) {
  const el = $("#siege-" + e.agent); if (!el) return;
  S.agents[e.agent].statut = e.statut;
  el.classList.toggle("actif", ["analyse", "reflexion", "redaction"].includes(e.statut));
  el.classList.toggle("termine", e.statut === "termine");
  el.classList.toggle("erreur", e.statut === "erreur");
  const st = el.querySelector(".statut");
  st.className = "statut st-" + e.statut;
  st.querySelector(".lib").textContent = e.statut === "erreur" ? "Erreur" :
    `${STATUTS[e.statut] || e.statut}${e.libelle && e.statut !== "termine" ? " · " + e.libelle : ""}${e.duree ? ` · ${e.duree} s` : ""}`;
  if (e.statut === "analyse") { const x = el.querySelector(".extrait"); x.textContent = ""; x.className = "extrait"; }
  if (e.statut === "erreur") { el.querySelector(".extrait").textContent = e.message || ""; }
  if (e.statut === "reflexion" || e.statut === "redaction") {
    const actifs = Object.values(S.agents).filter(a => ["analyse", "reflexion", "redaction"].includes(a.statut)).length;
    $("#stats").textContent = `${actifs} membre${actifs > 1 ? "s" : ""} en activité · ${S.contributions} contribution${S.contributions > 1 ? "s" : ""}`;
  }
}

function flux(e) {
  const x = $("#siege-" + e.agent)?.querySelector(".extrait"); if (!x) return;
  x.className = "extrait " + e.nature;
  x.textContent = e.extrait;   // en rédaction, le serveur n'envoie que les valeurs lisibles du JSON en cours
}

function contribution(e) {
  S.contributions++; S.tokens += (e.meta.tokens_sortie || 0);
  $("#nDebat").textContent = S.contributions;
  $("#stats").textContent = `${S.contributions} contribution${S.contributions > 1 ? "s" : ""} · ${S.tokens.toLocaleString("fr-FR")} tokens produits`;
  const c = e.contenu, id = e.agent, el = $("#siege-" + id);
  let corps = "";
  if (e.etape === "cadrage") {
    S.cadrage = c; $("#question").textContent = c.question_reformulee;
    corps = `<p>${avecRefs(c.question_reformulee)}</p>${liste("Options", c.options, o => `<b>${esc(o.id)}</b> · ${esc(o.nom)} : ${avecRefs(o.description)}`)}${liste("Critères", c.criteres)}`;
  } else if (e.etape === "avis") {
    S.avis[id] = c;
    S.posInit[id] = {opt: c.option_preferee, pos: c.position};
    rendreArene(false);
    el.querySelector(".s-bas").innerHTML = `<span class="pos ${c.position}">${POS[c.position]}</span><span>Option ${esc(c.option_preferee)}</span><span>${e.meta.sources.length} sources</span>`;
    corps = `<div class="c-tete" style="margin-top:6px"><span class="pos ${c.position}">${POS[c.position]}</span><span style="font-size:12px;color:var(--muted)">Option ${esc(c.option_preferee)} · confiance ${"●".repeat(c.confiance)}${"○".repeat(5 - c.confiance)}</span></div>
      <p>${avecRefs(c.resume)}</p><details><summary>Arguments, hypothèses et inconnues</summary>
      ${liste("Arguments", c.arguments, argumentSource)}${liste("Hypothèses", c.hypotheses)}${liste("Risques", c.risques)}
      ${liste("Ce que j'ignore", c.inconnues)}${liste("Ce qui me ferait changer d'avis", c.conditions_changement)}</details>`;
  } else if (e.etape === "contre_analyse") {
    corps = `<p>${avecRefs(c.resume)}</p><details open><summary>Hypothèses fragiles et scénarios d'échec</summary>
      ${liste("Hypothèses fragiles", c.hypotheses_fragiles, argumentSource)}${liste("Scénarios d'échec", c.scenarios_echec)}${liste("Angles morts", c.angles_morts)}</details>
      ${c.critique_composition ? `<h4>Composition du comité</h4><p>${avecRefs(c.critique_composition.commentaire)}</p>${liste("Angles absents", c.critique_composition.angles_absents)}${liste("Voix surreprésentées", c.critique_composition.voix_surrepresentees)}` : ""}`;
  } else if (e.etape === "objections") {
    S.objections = c.objections; phase("reponses");
    S.liens = c.objections.map(o => o.cible); dessinerLiens();
    corps = c.objections.map(o => `<div class="obj"><span class="id">${esc(o.id)}</span><div><b>→ ${esc(nomAgent(o.cible))}</b> ${argumentSource(o)}</div></div>`).join("");
  } else if (e.etape === "reponse") {
    S.reponses[id] = c;
    S.posFin[id] = {opt: c.option_revisee || S.posInit[id]?.opt, pos: c.position_revisee};
    rendreArene(true);
    if (!S.positionsVues) { S.positionsVues = true; ouvrirOnglet("positions"); }
    if (S.avis[id]) el.querySelector(".s-bas").innerHTML = `<span class="pos ${S.avis[id].position}" style="opacity:.55">${POS[S.avis[id].position]}</span>→<span class="pos ${c.position_revisee}">${POS[c.position_revisee]}</span>`;
    corps = c.reponses.map(r => `<div class="obj"><span class="id">${esc(r.objection_id)}</span><div><span class="att ${r.attitude}">${esc(r.attitude)}</span> ${avecRefs(r.texte)}</div></div>`).join("") +
      `<p style="color:var(--muted)">Position révisée : <span class="pos ${c.position_revisee}">${POS[c.position_revisee]}</span></p>`;
  } else if (e.etape === "synthese") {
    S.synthese = c;
    corps = `<p>${avecRefs(c.recommandation)}</p><p><a href="#" onclick="ouvrirOnglet('decision');return false" style="color:var(--brass)">Ouvrir le dossier de décision →</a></p>`;
  }
  const invalides = e.meta.sources_invalides.length ? `<div class="note" style="margin:8px 0 0;border-color:var(--err)">Références introuvables dans le dossier : ${e.meta.sources_invalides.map(chipRef).join(" ")}</div>` : "";
  const carte = document.createElement("div");
  carte.className = "carte"; carte.style.setProperty("--c", couleur(id));
  carte.innerHTML = `<div class="c-tete"><b>${esc(S.config.agents[id].titre)}</b><span class="c-etape">${ETAPES[e.etape]}</span>
    <span class="c-meta">${esc(e.meta.libelle)} · ${e.meta.duree} s</span></div>${corps}${invalides}`;
  ajouterFil(carte);
}

function ajouterFil(noeud) {
  const v = $("#vue-debat");
  v.querySelector(".vide")?.remove();
  v.prepend(noeud);
}

function note(texte, complement) {
  const n = document.createElement("div"); n.className = "note";
  n.innerHTML = esc(texte) + (complement ? `<br><i>« ${esc(complement)} »</i>` : "");
  ajouterFil(n);
}

// ------------------------------------------------------------------ liens contradicteur → cibles
function dessinerLiens() {
  const svg = $("#liens");
  const cibles = S.liens || [];
  const pt = id => { const a = ANGLES[id] * Math.PI / 180; return [50 + RX * Math.cos(a), 50 + RY * Math.sin(a)]; };
  const [x1, y1] = pt("contradicteur");
  svg.innerHTML = [...new Set(cibles)].map(c => { const [x2, y2] = pt(c); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" vector-effect="non-scaling-stroke"/>`; }).join("");
}

// ------------------------------------------------------------------ validation humaine
function texteContexte(x) {
  const p = x.plus_exigeante;
  return `Contexte : ${x.niveau === "depassement" ? "dépassement probable" : "marge réduite"} à l'étape « ${ETAPES[p.etape] || p.etape} » `
    + `(environ ${p.total.toLocaleString("fr-FR")} tokens pour ${p.contexte_max.toLocaleString("fr-FR")}). `
    + "Estimation prudente : un contrôle réel aura lieu avant cette étape, avec compactage si nécessaire.";
}

function blocCouverture(e) {
  if (!e?.couverture) return "";
  const lignes = Object.entries(e.couverture).map(([critere, membres]) => `<div>${esc(critere)}</div><div class="porteurs">${
    membres.length ? membres.map(m => `<span class="porteur">${esc(S.config.agents[m]?.nom || m)}</span>`).join("")
                   : `<span class="porteur aucun">sans porteur</span>`}</div>`).join("");
  const manque = e.criteres_sans_porteur?.length;
  return `<h4 style="font-size:12px;color:${manque ? "var(--warn)" : "var(--muted)"};margin:12px 0 4px">Couverture des critères${manque ? ` : ${manque} sans porteur` : ""}</h4>
    <div class="couverture">${lignes}</div>`;
}

function revisionEquipe(e) {
  const avant = S.config.agents;                       // les membres retirés ne figurent plus dans le nouveau comité
  if (e.comite) { S.config = {...S.config, agents: e.comite.agents, experts: e.comite.experts}; creerSieges(); majLegende(); }
  const nom = id => S.config.agents[id]?.nom || avant[id]?.nom || id;
  const parts = [];
  if (e.ajouts?.length) parts.push("ajout de " + e.ajouts.map(nom).join(", "));
  if (e.retraits?.length) parts.push("retrait de " + e.retraits.map(nom).join(", "));
  if (Object.keys(e.modeles || {}).length) parts.push("modèle changé pour " + Object.keys(e.modeles).map(nom).join(", "));
  if (e.mandats?.length) parts.push("mandat modifié pour " + e.mandats.map(nom).join(", "));
  const sans = e.criteres_sans_porteur?.length ? ` Critère${e.criteres_sans_porteur.length > 1 ? "s" : ""} désormais sans porteur : ${e.criteres_sans_porteur.join(", ")}.` : "";
  note(`Équipe révisée par le décideur : ${parts.join(" ; ")}.${sans}`, e.motif);
}

function ouvrirValidation(c, e = {}) {
  $("#btnLancer").disabled = false;
  const manque = !c.suffisant;
  $("#fenValidation").innerHTML = `<h2>Validation du cadrage</h2>
    <div class="sous">Le président a cadré la question. Validez-le pour lancer les analyses, ou apportez des précisions pour un nouveau cadrage.</div>
    <div class="carte" style="--c:var(--brass)"><p style="margin:0;font-family:var(--serif);font-size:16px">${avecRefs(c.question_reformulee)}</p>
      <p style="color:var(--muted)">${avecRefs(c.decision_attendue)}</p>
      ${liste("Options", c.options, o => `<b>${esc(o.id)}</b> · ${esc(o.nom)} : ${avecRefs(o.description)}`)}
      ${e.couverture ? "" : liste("Critères de décision", c.criteres)}${liste("Contraintes", c.contraintes)}${liste("Informations manquantes", c.informations_manquantes)}
      ${blocCouverture(e)}</div>
    ${c.questions_pour_humain?.length ? `<h4 style="font-size:12px;color:var(--warn);margin:12px 0 4px">${manque ? "Informations indispensables" : "Questions du président"}</h4>${c.questions_pour_humain.map(q => `<div class="alerte-q">${avecRefs(q)}</div>`).join("")}` : ""}
    <h4 style="font-size:12px;color:var(--muted);margin:14px 0 6px">Vos précisions (transmises à tous les membres)</h4>
    <textarea id="complement" placeholder="Ex. : la renégociation avec l'éditeur est exclue ; un prestataire peut être financé sur le budget run…"></textarea>
    <div class="actions"><button class="btn" id="btnValider">Valider et lancer les analyses</button>
      <button class="btn sec" id="btnRecadrer">Demander un nouveau cadrage</button></div>`;
  $("#voile").classList.add("on");
  if (S.rejeu) {
    $("#fenValidation .sous").textContent = "Rejeu d'une séance enregistrée : la validation du décideur va s'afficher.";
    $("#fenValidation .actions").innerHTML = `<span class="chip rejeu">Rejeu</span>`;
    $("#complement").readOnly = true; return;
  }
  $("#btnValider").onclick = () => envoyerValidation("valider");
  $("#btnRecadrer").onclick = () => envoyerValidation("recadrer");
}

async function envoyerValidation(action) {
  const complement = $("#complement").value.trim();
  if (action === "recadrer" && !complement) { $("#complement").focus(); return toast("Indiquez ce que le président doit prendre en compte."); }
  $("#btnLancer").disabled = true;
  await fetch(`/api/seances/${S.seance}/validation`, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({action, complement})});
}

// ------------------------------------------------------------------ fin de séance et décision
function fin(e) {
  clearInterval(S.timer); $("#btnLancer").disabled = false;
  $("#choixDossier").disabled = false;
  document.querySelectorAll(".siege").forEach(s => s.classList.remove("actif"));
  if (e.erreurs?.length) note("Incidents pendant la séance : " + e.erreurs.join(" ; "));
  if (!S.synthese) return toast("La séance s'est terminée sans synthèse.");
  $("#phaseTxt").textContent = "Arbitrage humain";
  rendreDecision(); ouvrirOnglet("decision");
  if (!S.rejeu) setTimeout(() => chargerRejeux($("#choixRejeu").value), 800);   // la séance devient rejouable
}

function rendreDecision() {
  const s = S.synthese;
  const lignes = Object.keys(S.avis).map(id => { const a = S.avis[id], r = S.reponses[id];
    return `<tr><td><span style="color:${couleur(id)}">●</span> ${esc(S.config.agents[id].nom)}</td><td>${esc(a.option_preferee)}</td>
      <td><span class="pos ${a.position}">${POS[a.position]}</span></td><td>${r ? `${esc(r.option_revisee || a.option_preferee)} · <span class="pos ${r.position_revisee}">${POS[r.position_revisee]}</span>` : "<span style='color:var(--faint)'>sans objection</span>"}</td></tr>`; }).join("");
  $("#vue-decision").innerHTML = `
    <div class="reco">${avecRefs(s.recommandation)}</div>
    ${Object.keys(S.posFin).length ? `<p><a href="#" onclick="ouvrirOnglet('positions');rejouerEvolution();return false" style="color:var(--brass)">Voir comment le débat a fait évoluer les positions →</a></p>` : ""}
    ${vueCriteres(s)}
    <div class="bloc"><h3>Conditions</h3><ul>${s.conditions.map(c => `<li>${avecRefs(c)}</li>`).join("")}</ul></div>
    <div class="bloc"><h3>Options</h3><div class="opts">${s.options.map(o => `<div class="opt"><b>${esc(o.nom)}</b><div class="cols">
      <div class="pour"><b>Pour</b><ul>${o.pour.map(x => `<li>${avecRefs(x)}</li>`).join("")}</ul></div>
      <div class="contre"><b>Contre</b><ul>${o.contre.map(x => `<li>${avecRefs(x)}</li>`).join("")}</ul></div></div>
      ${o.criteres?.length ? `<div class="comparaison"><table class="matrice"><caption>Évaluation des critères</caption><thead><tr><th scope="col">Critère</th><th scope="col">Évaluation et justification</th></tr></thead><tbody>${o.criteres.map(c => `<tr><th scope="row">${esc(c.critere)}</th><td><span class="evaluation">${esc(EVALUATIONS[c.evaluation] || c.evaluation)}</span><br>${avecRefs(c.justification)}${sourcesRefs(c.sources)}</td></tr>`).join("")}</tbody></table></div>` : ""}
      ${liste("Preuves documentées", o.preuves, argumentSource)}
      ${liste("Objections", o.objections)}${liste("Incertitudes", o.incertitudes)}</div>`).join("")}</div>
      <p class="note">Les preuves renvoient au dossier ; les évaluations restent des analyses à vérifier. Le nombre d'avis favorables ne constitue pas une preuve.</p></div>
    <div class="bloc"><h3>Positions des membres</h3><table class="matrice"><tr><th>Membre</th><th>Option</th><th>Initiale</th><th>Après contradiction</th></tr>${lignes}</table></div>
    <div class="bloc"><h3>Accords</h3><ul>${s.accords.map(x => `<li>${avecRefs(x)}</li>`).join("")}</ul></div>
    <div class="bloc"><h3>Désaccords persistants</h3><ul>${s.desaccords.map(d => `<li><b>${esc(d.sujet)}</b> : ${avecRefs(d.positions)}</li>`).join("")}</ul></div>
    <div class="bloc"><h3>Hypothèses fragiles</h3><ul>${s.hypotheses_fragiles.map(x => `<li>${avecRefs(x)}</li>`).join("")}</ul></div>
    <div class="bloc"><h3>Informations à obtenir</h3><ul>${s.informations_a_obtenir.map(x => `<li>${avecRefs(x)}</li>`).join("")}</ul></div>
    ${S.rejeu ? `<div class="bloc"><h3>Arbitrage du décideur</h3><p>${S.rejeu.decision_humaine ? esc(S.rejeu.decision_humaine) : "<span style='color:var(--faint)'>Aucune décision enregistrée lors de cette séance.</span>"}</p>
      <div class="actions"><a class="btn sec" style="text-decoration:none" href="/api/dossiers/${encodeURIComponent(S.rejeu.dossier)}/rejeux/${encodeURIComponent(S.rejeu.id)}/compte-rendu.md">Télécharger le compte rendu</a></div></div>`
    : `<div class="bloc"><h3>Votre arbitrage</h3><textarea id="decision" placeholder="La décision que vous retenez, et pourquoi."></textarea>
      <div class="actions"><button class="btn" id="btnDecision">Enregistrer la décision</button>
      <a class="btn sec" style="text-decoration:none" href="/api/seances/${S.seance}/compte-rendu.md">Télécharger le compte rendu</a></div></div>`}`;
  if (S.rejeu) return;
  $("#btnDecision").onclick = async () => {
    const texte = $("#decision").value.trim(); if (!texte) return $("#decision").focus();
    await fetch(`/api/seances/${S.seance}/decision`, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({texte})});
    $("#btnDecision").textContent = "Décision enregistrée ✓";
  };
}

// ------------------------------------------------------------------ carte des positions
// Chaque expert est un point : colonne = option préférée, hauteur = position. Après la contradiction,
// les points glissent vers leur option et leur position révisées.
function couloirs() {
  const options = (S.cadrage?.options || []).map(o => ({id: String(o.id), nom: o.nom}));
  const vus = [...Object.values(S.posInit), ...Object.values(S.posFin)].map(p => couloirDe(p.opt, options));
  if (vus.includes("?")) options.push({id: "?", nom: "Autre ou non précisée"});
  return options;
}

function couloirDe(valeur, options) {
  const v = String(valeur ?? "").toUpperCase().trim();
  const o = options.find(o => v === o.id.toUpperCase() ||
    new RegExp(`(^|[^A-Z0-9])${o.id.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^A-Z0-9]|$)`).test(v));
  return o ? o.id : "?";
}

function coordonnees(options, positions) {
  const n = options.length, cases = {}, res = {};
  const ordre = S.config.experts.filter(id => positions[id]);
  for (const id of ordre) {
    const p = positions[id];
    const i = Math.max(0, options.findIndex(o => o.id === couloirDe(p.opt, options)));
    const j = Math.max(0, NIVEAUX.indexOf(p.pos));
    (cases[i + "|" + j] ||= []).push(id);
    res[id] = {i, j};
  }
  for (const [cle, ids] of Object.entries(cases)) {
    const [i, j] = cle.split("|").map(Number);
    ids.forEach((id, k) => {
      res[id] = {x: 19 + (i + 0.5) * (79 / n) + (k - (ids.length - 1) / 2) * Math.min(8, 60 / n / ids.length), y: 12 + j * 20};
    });
  }
  return res;
}

function rendreArene(final) {
  if (!Object.keys(S.posInit).length) return;
  const options = couloirs();
  const vue = $("#vue-positions");
  let arene = vue.querySelector(".arene");
  const signature = options.map(o => o.id).join(",");
  if (!arene || arene.dataset.options !== signature) {
    vue.innerHTML = `<p class="recit" style="margin-top:0">Chaque point est un membre du COMEX : la colonne indique l'option qu'il préfère, la hauteur sa position.</p>
      <div class="arene" data-options="${esc(signature)}">
        ${NIVEAUX.map((n, j) => `<div class="niveau" style="top:${12 + j * 20}%"><span>${NIVEAUX_COURTS[n]}</span></div>`).join("")}
        ${options.map((o, i) => `<div class="couloir" style="left:${19 + i * (79 / options.length)}%"></div>
          <div class="nom-couloir" style="left:${19 + (i + 0.5) * (79 / options.length)}%"><b>${esc(o.id)}</b>${esc(o.nom)}</div>`).join("")}
        <svg viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      </div>
      <div class="recit" id="recit"></div>
      <div class="actions" id="actionsArene"></div>`;
    arene = vue.querySelector(".arene");
  }
  const positions = final ? {...S.posInit, ...S.posFin} : S.posInit;
  const xy = coordonnees(options, positions), depart = coordonnees(options, S.posInit);
  for (const id of Object.keys(positions)) {
    let p = arene.querySelector(`[data-agent="${id}"]`);
    if (!p) {
      p = document.createElement("div");
      p.className = "point"; p.dataset.agent = id;
      p.style.setProperty("--c", couleur(id));
      p.textContent = S.config.agents[id].initiales;
      p.title = S.config.agents[id].titre;
      p.style.left = xy[id].x + "%"; p.style.top = xy[id].y + "%";
      arene.appendChild(p);
      requestAnimationFrame(() => p.classList.add("visible"));
    }
    p.style.left = xy[id].x + "%"; p.style.top = xy[id].y + "%";
    const bouge = final && S.posFin[id] && (depart[id].x !== xy[id].x || depart[id].y !== xy[id].y);
    p.classList.toggle("bouge", !!bouge);
  }
  arene.classList.toggle("final", final);
  // Trajectoires : de la position initiale vers la position révisée
  arene.querySelector("svg").innerHTML = final ? Object.keys(S.posFin).filter(id => depart[id] && xy[id] &&
    (depart[id].x !== xy[id].x || depart[id].y !== xy[id].y)).map(id => {
      const a = depart[id], b = xy[id];
      return `<path d="M${a.x} ${a.y} Q ${(a.x + b.x) / 2} ${Math.min(a.y, b.y) - 9} ${b.x} ${b.y}" vector-effect="non-scaling-stroke"/>`;
    }).join("") : "";
  $("#recit").innerHTML = recitPositions(options);
  $("#nPositions").textContent = Object.keys(S.posInit).length;
  $("#actionsArene").innerHTML = Object.keys(S.posFin).length
    ? `<button class="btn sec" onclick="rejouerEvolution()">Rejouer l'évolution</button>` : "";
}

function recitPositions(options) {
  const compte = positions => {
    const c = {};
    Object.values(positions).forEach(p => { const o = couloirDe(p.opt, options); c[o] = (c[o] || 0) + 1; });
    return Object.entries(c).sort((a, b) => b[1] - a[1]).map(([o, n]) => `<b>${n}</b> pour ${esc(o === "?" ? "une autre option" : o)}`).join(", ");
  };
  let texte = `Avant la contradiction : ${compte(S.posInit)}.`;
  const fin = {...S.posInit, ...S.posFin};
  const evolutions = Object.keys(S.posFin).filter(id => S.posInit[id] &&
    (couloirDe(S.posInit[id].opt, options) !== couloirDe(S.posFin[id].opt, options) || S.posInit[id].pos !== S.posFin[id].pos));
  if (Object.keys(S.posFin).length) {
    texte += `<br>Après : ${compte(fin)}.<br>Le débat a fait évoluer <b>${evolutions.length}</b> position${evolutions.length > 1 ? "s" : ""} sur ${Object.keys(S.posInit).length}`
      + (evolutions.length ? ` (${evolutions.map(nomAgent).join(", ")}).` : ".");
  }
  return texte + `<br><span style="color:var(--faint);font-size:12px">Un nombre d'avis n'est pas une preuve : la recommandation repose sur les arguments sourcés.</span>`;
}

async function rejouerEvolution() {
  const arene = $("#vue-positions .arene"); if (!arene) return;
  arene.classList.add("sans-transition");
  rendreArene(false);
  void arene.offsetWidth;                        // applique l'état initial sans animation
  arene.classList.remove("sans-transition");
  await pause(700);
  rendreArene(true);
}

// ------------------------------------------------------------------ vue d'ensemble des critères
function vueCriteres(s) {
  const options = (s.options || []).map((o, oi) => ({...o, oi})).filter(o => o.criteres?.length);
  if (!options.length) return "";
  const criteres = [...new Set([...(S.cadrage?.criteres || []), ...options.flatMap(o => o.criteres.map(c => c.critere))])]
    .filter(c => options.some(o => o.criteres.some(x => x.critere === c)));
  let total = 0, inconnus = 0;
  const lignes = criteres.map(c => `<div class="crit">${esc(c)}</div>` + options.map(o => {
    const k = o.criteres.findIndex(x => x.critere === c);
    if (k < 0) return "<div></div>";
    const ev = o.criteres[k].evaluation; total++; if (ev === "inconnu") inconnus++;
    return `<button type="button" class="cellule ev-${esc(ev)}" data-o="${o.oi}" data-c="${k}" title="Voir la justification">${esc(EVALUATIONS[ev] || ev)}</button>`;
  }).join("")).join("");
  return `<div class="bloc"><h3>Vue d'ensemble des critères</h3>
    <div class="chaleur" style="grid-template-columns:minmax(110px,1.4fr) repeat(${options.length},1fr)">
      <div></div>${options.map(o => `<div class="tete">${esc(o.nom)}</div>`).join("")}${lignes}</div>
    <p class="recit">${inconnus ? `<b>${inconnus}</b> évaluation${inconnus > 1 ? "s" : ""} sur ${total} reste${inconnus > 1 ? "nt" : ""} à documenter : c'est ce que personne ne sait encore.` : "Toutes les évaluations sont étayées par le dossier."} Cliquez sur une case pour voir la justification et ses sources.</p></div>`;
}

function voirCritere(oi, ci) {
  const o = S.synthese?.options?.[oi], c = o?.criteres?.[ci]; if (!c) return;
  sourceRequete++;
  sourceRetour = document.activeElement;
  $("#popContenu").innerHTML = `<div class="source-tete"><b>${esc(o.nom)}</b><button type="button" class="btn sec" data-fermer-source>Fermer</button></div>
    <h2 style="margin-top:12px">${esc(c.critere)}</h2>
    <p><span class="cellule ev-${esc(c.evaluation)}" style="display:inline-block;cursor:default;padding:4px 10px">${esc(EVALUATIONS[c.evaluation] || c.evaluation)}</span></p>
    <p>${avecRefs(c.justification)}</p>${c.sources?.length ? sourcesRefs(c.sources) : `<p class="sous">Aucune source : évaluation à documenter.</p>`}`;
  $("#pop").classList.add("on");
  $("#pop [data-fermer-source]").focus();
}

// ------------------------------------------------------------------ utilitaires
function ouvrirOnglet(v) {
  document.querySelectorAll(".onglet").forEach(b => b.classList.toggle("on", b.dataset.vue === v));
  document.querySelectorAll(".vue").forEach(x => x.classList.toggle("on", x.id === "vue-" + v));
}

let sourceRetour = null, sourceRequete = 0;
function fermerSection() {
  sourceRequete++;
  $("#pop").classList.remove("on");
  if (sourceRetour?.isConnected) sourceRetour.focus();
}
async function voirSection(ref, nom = S.dossier?.nom) {
  if (!ref || !nom) return;
  const requete = ++sourceRequete;
  sourceRetour = document.activeElement;
  const tete = `<div class="source-tete"><b>${esc(ref)}</b><button type="button" class="btn sec" data-fermer-source>Fermer</button></div>`;
  $("#popContenu").innerHTML = tete + '<p role="status">Chargement du passage…</p>';
  $("#pop").classList.add("on");
  $("#pop [data-fermer-source]").focus();
  try {
    const r = await fetch(`/api/dossiers/${encodeURIComponent(nom)}/sections/${encodeURIComponent(ref)}`);
    if (requete !== sourceRequete) return;
    if (!r.ok) {
      $("#popContenu").innerHTML = tete + `<p role="alert">${r.status === 404 ? "Cette référence n'existe pas dans le dossier. Elle ne peut pas étayer l'analyse." : "Impossible de charger le passage. Réessayez."}</p>`;
    } else {
      const s = await r.json();
      if (requete !== sourceRequete) return;
      $("#popContenu").innerHTML = tete + `<h2 style="margin-top:12px">${esc(s.titre)}</h2><div class="sous">${esc(s.document)} · ${esc(s.fichier)}</div><pre>${esc(s.texte)}</pre>`;
    }
  } catch {
    if (requete !== sourceRequete) return;
    $("#popContenu").innerHTML = tete + '<p role="alert">Connexion indisponible. Réessayez pour lire le passage.</p>';
  }
  $("#pop [data-fermer-source]").focus();
}

function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 6000); }

init();
</script>
